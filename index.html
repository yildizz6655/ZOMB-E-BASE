
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ZOMBIE BASE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loading">
    <h1>ZOMBIE BASE</h1>
    <p>Askerî üs yükleniyor...</p>
</div>

<div id="hud">
    <div class="top">
        <span>❤️ CAN: <b id="health">100</b></span>
        <span>🔫 MERMİ: <b id="ammo">30</b></span>
        <span>🧟 ZOMBİ: <b id="zombies">5</b></span>
    </div>

    <div id="message">HAYATTA KAL!</div>
    <div id="crosshair">+</div>

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <button id="fire">ATEŞ</button>
    <button id="reload">DOLDUR</button>
</div>

<script type="module" src="game.js"></script>
</body>
</html>
